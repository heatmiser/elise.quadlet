---
# Deployment mode: pull (registry at runtime) | embedded (images pre-staged via dcm-image-load.service)
elise_quadlet_service_mode: pull

# Quadlet unit destination — mutable /etc layer, safe for bootc 3-way merge
elise_quadlet_quadlet_dir: /etc/containers/systemd

# EnvironmentFile path — written by env.j2; referenced in container units via EnvironmentFile=
elise_quadlet_env_file_path: ""

# Core data model — caller populates all of these
elise_quadlet_containers: []   # list of container dicts (required — see argument_specs.yml)
elise_quadlet_pod: {}          # pod dict (optional; empty dict = no pod unit rendered)
elise_quadlet_network: {}      # network dict (optional; empty dict = no network unit rendered)
elise_quadlet_volumes: []      # list of volume dicts (optional)
elise_quadlet_env_vars: {}     # key=value dict written to EnvironmentFile (optional)

# Pull mode: system packages to install (ignored in embedded mode)
elise_quadlet_required_packages: []

# Pull mode: firewall ports to open (ignored in embedded mode)
# Each entry is passed to ansible.posix.firewalld
elise_quadlet_firewall_ports: []

# Pull mode: registry auth — leave empty to skip podman login
elise_quadlet_registry: ""
elise_quadlet_registry_username: ""
elise_quadlet_registry_password: ""
...
