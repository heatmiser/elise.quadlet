---
# Render order: network → volumes → pod → containers → env file
# Each template task notifies the systemd daemon-reload handler.
# In embedded mode the handler is a no-op (first-boot service owns the reload).

- name: Sub |Render network unit file
  ansible.builtin.template:
    src: network.j2
    dest: "{{ elise_quadlet_quadlet_dir }}/{{ elise_quadlet_network.name }}.network"
    mode: "0644"
  when: elise_quadlet_network | length > 0
  notify: Reload systemd daemon

- name: Sub |Render volume unit files
  ansible.builtin.template:
    src: volume.j2
    dest: "{{ elise_quadlet_quadlet_dir }}/{{ item.name }}.volume"
    mode: "0644"
  loop: "{{ elise_quadlet_volumes }}"
  loop_control:
    label: "{{ item.name }}.volume"
  when: elise_quadlet_volumes | length > 0
  notify: Reload systemd daemon

- name: Sub |Render pod unit file
  ansible.builtin.template:
    src: pod.j2
    dest: "{{ elise_quadlet_quadlet_dir }}/{{ elise_quadlet_pod.name }}.pod"
    mode: "0644"
  when: elise_quadlet_pod | length > 0
  notify: Reload systemd daemon

- name: Sub |Render container unit files
  ansible.builtin.template:
    src: container.j2
    dest: "{{ elise_quadlet_quadlet_dir }}/{{ item.name }}.container"
    mode: "0644"
  loop: "{{ elise_quadlet_containers }}"
  loop_control:
    label: "{{ item.name }}.container"
  notify: Reload systemd daemon

# EnvironmentFile contains secrets — mode 0600
- name: Sub |Render EnvironmentFile
  ansible.builtin.template:
    src: env.j2
    dest: "{{ elise_quadlet_env_file_path }}"
    mode: "0600"
  when:
    - elise_quadlet_env_vars | length > 0
    - elise_quadlet_env_file_path | length > 0
...
